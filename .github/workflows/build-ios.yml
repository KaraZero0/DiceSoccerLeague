name: Build iOS IPA

on:
  workflow_dispatch: {}
  push:
    branches:
      - unity
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package IPA (macOS Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract Pre-Exported Unity Xcode Project
        run: |
          mkdir -p xcode-project
          cat .github/ios-xcode-export/ios-xcode.tar.zst.part-* | zstd -d -c | tar -xf - -C xcode-project
          chmod -R +x xcode-project/Il2CppOutputProject/IL2CPP/build
          chmod +x xcode-project/process_symbols*.sh 2>/dev/null || true

      - name: Prepare Unsigned Xcode Build Settings
        run: |
          cd xcode-project
          sed -i '' 's/CodeSignOnCopy, //g' Unity-iPhone.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Unity-iPhone.xcodeproj/project.pbxproj

      - name: Build Application with Xcode
        run: |
          cd xcode-project
          xcodebuild build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM=""

      - name: Package & Ad-Hoc Sign IPA
        run: |
          cd xcode-project
          rm -rf Payload
          mkdir -p Payload
          APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" Payload/DiceSoccer.app
          codesign --force --deep --sign - Payload/DiceSoccer.app
          zip -r -9 ../DiceSoccer.ipa Payload
          cd ..
          ls -lh DiceSoccer.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiceSoccer-iOS-IPA
          path: DiceSoccer.ipa
          retention-days: 90

      - name: Attach IPA and APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v1.0.0"
          fi
          if [ -f .github/ios-xcode-export/DiceSoccer.apk.zst ]; then
            zstd -d -f .github/ios-xcode-export/DiceSoccer.apk.zst -o DiceSoccer.apk
            gh release upload "$TAG_NAME" DiceSoccer.ipa DiceSoccer.apk --clobber || true
          else
            gh release upload "$TAG_NAME" DiceSoccer.ipa --clobber || true
          fi
